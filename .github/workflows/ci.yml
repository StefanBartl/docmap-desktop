# Runs the checks on every push and pull request: cargo fmt --check, cargo
# clippy -D warnings and cargo test (Rust), and node --test (the shared frontend helpers under src/lib/);
# a second job, `tokens`, checks the design tokens copied from appkit-ui, and a third, `engine`, holds
# docmap.nvim to the contract of engine.lock. Deliberately
# separate from release.yml, which builds real installers from a real
# downloaded engine sidecar and only runs on a pushed vX.Y.Z tag -- this one
# only needs the Rust/JS code itself to be correct, on every push, without
# waiting for a release.
#
# cargo build/test still goes through build.rs's own resource checks
# (tauri.{windows,linux}.conf.json's externalBin/resources -- see main.rs's
# engine_sidecar()/resolve_grammars()), so Linux and Windows each stage a
# placeholder sidecar binary and a placeholder grammars file first: empty
# files, not a real engine. That is enough for the build script's
# existence checks and for the one test that exercises sidecar
# *resolution* (does the configured path resolve to a real file at all) --
# a different question from "does the engine actually work", which belongs
# to docmap.nvim's own CI, not this one. macOS needs neither
# placeholder: tauri.conf.json's base config has no externalBin/resources
# at all, only the Windows/Linux platform overrides do (see release.yml's
# own engine_triple: "" for macOS, same reasoning).

# The repository is private and has no paid plan, so hosted runners do not start: every job runs on the
# self-hosted Windows runner of the author. Windows is
# the only platform built and tested here; Linux and macOS are gone from the matrix. The Windows-only
# placeholders below are what build.rs needs.

name: CI

on:
  push:
  pull_request:

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  test:
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Deliberately the floating `stable`, not a pinned version (same choice
      # as the author's other desktop app). The consequence is known and accepted: a new
      # stable release can ship new default clippy lints or change what rustfmt
      # considers formatted, and the clippy step below (-D warnings) or the fmt
      # check above it then turns this CI red WITHOUT any code change
      # (tasks-desktop saw exactly that with Rust 1.99, c43e4ab). The fix in
      # that case is to adjust the code (`cargo fmt`, or allow the lint with a
      # stated reason), never to pin the toolchain to silence it. A local
      # toolchain at the same stable version reproduces it before pushing.
      # (The toolchain is the stable one of the runner machine, with clippy and rustfmt: the action
      # dtolnay/rust-toolchain runs `shell: bash`, which is the WSL launcher there.)

      - name: stage a placeholder engine sidecar
        run: |
          mkdir -p src-tauri/binaries src-tauri/resources/grammars
          touch "src-tauri/binaries/docmap-x86_64-pc-windows-msvc.exe"
          touch src-tauri/resources/grammars/placeholder.dll

      # Formatting is a gate like clippy, on every platform and ahead of it (the
      # cheaper failure first). Needs no placeholders: it only parses sources.
      # Line endings: src-tauri/rustfmt.toml pins `newline_style = "Unix"`, which
      # turns a CRLF source file into a failure ("Incorrect newline style"), not
      # into something rustfmt tolerates. What keeps this step green on the
      # Windows runner is the checkout: .gitattributes' `eol=lf` gives every
      # runner LF files. A developer on Windows whose editor writes CRLF sees
      # the error locally although git would normalise the file on commit: use
      # an LF editor setting, or `git config core.autocrlf input`.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      # Needs the staged placeholders above (build.rs runs under clippy too).
      # Runs on every platform of the matrix because the lints of
      # `cfg(target_os = ...)` code are only visible on that target: a
      # Windows-only clippy run would never see the Linux/macOS branches.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `node --test` only ever loads what a test imports, and nothing
      # imports `src/main.js` — it needs `window.__TAURI__`, so it cannot be
      # unit-tested as it stands. That left the ~700 lines that *are* the
      # user interface with no syntax gate whatsoever, and a shipped,
      # unterminated string literal in `renderEngine` proved it: the module
      # failed to parse, so every control in the sidebar did nothing, and the
      # Rust and lib tests stayed green through all of it.
      - name: node --check (the frontend actually parses)
        run: |
          for f in src/*.js src/lib/*.js; do
            node --check "$f"
          done

      - name: node --test
        run: node --test src/lib/*.test.js

  # The design tokens come from appkit-ui as a checked-in copy (no package
  # manager in this frontend). The copy and its generated fallback must be
  # the kit's file at the tag in tools/appkit-ui.pin, and that tag must still
  # name the pinned commit; no colour may be written outside the tokens.
  # The release-kit actions of rolling.yml and release.yml are the commit of
  # tools/release-kit.pin, and that tag still names it.
  # One platform is enough: these read files, nothing here is built.
  tokens:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # appkit is private: the runner reads it with the login of `gh`, no token secret.
      - name: the token copy matches the pinned appkit tag
        run: |
          PRIVATE_READ_TOKEN="$(gh auth token)" python tools/check-appkit-tokens.py

      - name: the release-kit actions are the pinned commit
        run: python tools/check-release-kit-pin.py

      - name: no colour outside the tokens
        run: python tools/check-colors.py

      - name: unit tests of the tools
        run: python -m unittest discover -s tools -p "test_*.py"

  # The engine contract of engine.lock: docmap.nvim's source at the pinned commit writes that
  # schema and answers those routes, contract/docmap.schema.json is its `.docmap.json` schema byte for
  # byte, and the binary of the rolling release `standalone-latest` -- the one release.yml and
  # rolling.yml bundle -- still answers that schema and those routes. A rolling release has no number
  # to pin, so this job is what holds it: red here without a change in this repository means the
  # engine moved, and the answer is to move engine.lock (its header says how), not to retry.
  # The Windows engine, now: the only platform this repository builds on.
  engine:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: download the rolling engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf engine-dl
          gh release download standalone-latest \
            --repo WKDSteve/docmap.nvim \
            --pattern "docmap-x86_64-pc-windows-msvc.exe" \
            --dir engine-dl

      - name: the engine is in step with engine.lock
        run: python tools/check-engine-lock.py --binary "$(cygpath -m "$PWD")/engine-dl/docmap-x86_64-pc-windows-msvc.exe"
