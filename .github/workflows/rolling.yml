# The rolling build: after every green CI run on main, the installers of exactly that commit are built for
# Windows and put on the pre-release `latest`, whose files are replaced each time. It is for
# trying the newest state with a click, not a release: no version tag, not signed. A release stays a
# deliberate act (release.yml, a pushed tag, a draft a person opens).
#
#   docmap-desktop-windows-x86_64-setup.exe   the NSIS setup of Windows (the engine is bundled)
#   install.ps1                               installs exactly this build for the current user (release-kit
#                                             of appkit, stamped for the channel `latest`)
#   SHA256SUMS                                the checksums of both
#
# Runs on the self-hosted Windows runner of the author (the repository is private and has no paid plan, so
# hosted runners do not start), so only Windows is
# built: the AppImage and install.sh of the earlier hosted workflow are gone. The release-kit actions run
# there by Git Bash (appkit v0.23.1 and later).
#
# Deciding (only the tip of main is built) and publishing (SHA256SUMS first, the words of the page last) are
# the actions prepare and publish of appkit's release-kit, pinned by the commit of tools/release-kit.pin
# (tools/check-release-kit-pin.py checks that they agree). The build is ours: its files go to publish as
# artifacts. There is no macOS here: docmap.nvim publishes no macOS engine.
#
# Actions are pinned by commit; a job gets only the rights it needs.

name: rolling

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only the run of the TIP of main may build, and a newer tip replaces a build that is still running: the
# pre-release must end on the newest commit. For a `workflow_run` event `github.sha` is the tip of main when
# the run started and `head_sha` is the commit the CI run was about, so a CI run of an OLDER commit that
# finishes late lands in a group of its own (it builds nothing, `prepare` says so) and can neither cancel the
# build of the tip nor push the waiting build of the tip out of the queue.
concurrency:
  group: rolling-${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  prepare:
    # Only a green run that came from a push to main (not a pull request).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      current: ${{ steps.prepare.outputs.current }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - id: prepare
        uses: WKDSteve/appkit/release-kit/prepare@2d0f4a6921d11848bbb579e2760614e88723e42d # v0.23.1
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          token: ${{ github.token }}

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.current == 'true' }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    env:
      SUFFIX: -setup.exe
      ASSET: docmap-desktop-windows-x86_64-setup.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - uses: ./.github/actions/engine-sidecar
        with:
          triple: x86_64-pc-windows-msvc
          token: ${{ github.token }}

      # The Tauri CLI directly, not tauri-apps/tauri-action: on the self-hosted runner the action's CLI does
      # not find `cargo` ("cargo metadata ... os error 2"), while the same CLI started from the job's own
      # shell does. The action only built here anyway (no tagName, nothing uploaded).
      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis

      # The one installer of this platform, under the fixed name of the rolling build.
      - name: Name the installer
        run: |
          mkdir -p dist
          found="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name "*$SUFFIX")"
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one file ending in $SUFFIX, the build made: $(ls src-tauri/target/release/bundle/nsis)"
            exit 1
          fi
          cp "$found" "dist/$ASSET"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rolling-windows
          path: dist/docmap-desktop-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 1

  # The files, the stamped install scripts and the checksums go up in one job; the words of the page move
  # last, so only then does it name this commit.
  publish:
    needs: [prepare, build]
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rolling-*
          path: dist
          merge-multiple: true
      - uses: WKDSteve/appkit/release-kit/publish@2d0f4a6921d11848bbb579e2760614e88723e42d # v0.23.1
        with:
          token: ${{ github.token }}
          tag: latest
          sha: ${{ needs.prepare.outputs.sha }}
          files: dist
          expect: 1
          app: docmap-desktop
          windows-kind: nsis
          windows-release-asset: docmap-desktop_{version}_x64-setup.exe
          windows-rolling-asset: docmap-desktop-windows-x86_64-setup.exe
          notes-file: .github/rolling-notes.md
