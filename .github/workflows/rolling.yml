# The rolling build: after every green CI run on main, the installers of exactly that commit are built for
# Windows and Linux and put on the pre-release `latest`, whose files are replaced each time. It is for
# trying the newest state with a click, not a release: no version tag, not signed. A release stays a
# deliberate act (release.yml, a pushed tag, a draft a person opens).
#
#   docmap-desktop-windows-x86_64-setup.exe   the NSIS setup of Windows (the engine is bundled)
#   docmap-desktop-linux-x86_64.AppImage      the AppImage of Linux (the engine is bundled)
#   install.ps1, install.sh                   install exactly this build for the current user (release-kit
#                                             of appkit, stamped for the channel `latest`)
#   SHA256SUMS                                the checksums of all of them
#
# Deciding (only the tip of main is built) and publishing (SHA256SUMS first, the words of the page last) are
# the actions prepare and publish of appkit's release-kit, pinned by the commit of tools/release-kit.pin
# (tools/check-release-kit-pin.py checks that they agree). The build is ours: its files go to publish as
# artifacts. There is no macOS here: documentation.nvim publishes no macOS engine.
#
# Actions are pinned by commit; a job gets only the rights it needs.

name: rolling

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only the run of the TIP of main may build, and a newer tip replaces a build that is still running: the
# pre-release must end on the newest commit. For a `workflow_run` event `github.sha` is the tip of main when
# the run started and `head_sha` is the commit the CI run was about, so a CI run of an OLDER commit that
# finishes late lands in a group of its own (it builds nothing, `prepare` says so) and can neither cancel the
# build of the tip nor push the waiting build of the tip out of the queue.
concurrency:
  group: rolling-${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    # Only a green run that came from a push to main (not a pull request).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      current: ${{ steps.prepare.outputs.current }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - id: prepare
        uses: StefanBartl/appkit/release-kit/prepare@e76ee82e2484d53c18350a33e6530e8b8c33ca08 # v0.19.1
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          token: ${{ github.token }}

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.current == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            bundle: nsis
            suffix: -setup.exe
            asset: docmap-desktop-windows-x86_64-setup.exe
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundle: appimage
            suffix: .AppImage
            asset: docmap-desktop-linux-x86_64.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      # WebKitGTK is Linux's WebView2/WKWebView equivalent; the build headers are a separate package from
      # the runtime library Tauri links against.
      - name: install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - uses: ./.github/actions/engine-sidecar
        with:
          triple: ${{ matrix.triple }}
          token: ${{ github.token }}

      # Build only: no tagName, so the action uploads nothing and hands the paths of what it made on.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        id: tauri
        with:
          args: --bundles ${{ matrix.bundle }}

      # The one installer of this platform, under the fixed name of the rolling build.
      - name: Name the installer
        shell: bash
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          SUFFIX: ${{ matrix.suffix }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          found="$(printf '%s' "$PATHS" | jq -r --arg s "$SUFFIX" '.[] | select(endswith($s))')"
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one file ending in $SUFFIX, the build made: $PATHS"
            exit 1
          fi
          # artifactPaths holds Windows paths on a Windows runner: bash wants the POSIX spelling.
          found="$(cygpath -u "$found" 2>/dev/null || printf '%s' "$found")"
          cp "$found" "dist/$ASSET"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rolling-${{ matrix.platform }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # The files, the stamped install scripts and the checksums go up in one job; the words of the page move
  # last, so only then does it name this commit.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rolling-*
          path: dist
          merge-multiple: true
      - uses: StefanBartl/appkit/release-kit/publish@e76ee82e2484d53c18350a33e6530e8b8c33ca08 # v0.19.1
        with:
          token: ${{ github.token }}
          tag: latest
          sha: ${{ needs.prepare.outputs.sha }}
          files: dist
          expect: 2
          app: docmap-desktop
          windows-kind: nsis
          windows-release-asset: docmap-desktop_{version}_x64-setup.exe
          windows-rolling-asset: docmap-desktop-windows-x86_64-setup.exe
          unix-kind: appimage
          unix-program: docmap-desktop
          unix-release-asset: docmap-desktop_{version}_amd64.AppImage
          unix-rolling-asset: docmap-desktop-linux-x86_64.AppImage
          notes-file: .github/rolling-notes.md
