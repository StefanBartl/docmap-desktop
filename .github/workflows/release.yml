# A release is a deliberate act: it starts with a pushed tag `vX.Y.Z` and ends as a DRAFT that a person opens,
# installs from and clicks through before publishing it (docs/RELEASING.md). Nothing here publishes.
#
# What it makes:
#   an installer per platform         the Windows `-setup.exe` and `.msi` (the engine is bundled), the Linux
#                                     `.deb`, `.rpm` and `.AppImage` (the engine is bundled), the macOS `.dmg`
#                                     and `.app.tar.gz` for both architectures (no bundled engine)
#   install.ps1, install.sh           install exactly this release for the current user, without a browser
#                                     download in the way of SmartScreen (release-kit of appkit, stamped for
#                                     this tag)
#   SHA256SUMS                        the checksums of all of them
#
# Before anything is built (`check`): the tag, the version of the two manifests and the main branch agree, the
# CI of main was green for this very commit, and no published release of the tag exists. The draft, its files
# and the checksums are made by the action `publish` of appkit's release-kit, pinned by the commit of
# tools/release-kit.pin (tools/check-release-kit-pin.py checks that they agree). A published release is never
# touched again.
#
# `frontendDist` in tauri.conf.json points straight at `../src`: no bundler, no package.json, nothing to
# `npm install`, so a build only needs the Rust toolchain plus each OS's native webview dependencies.
#
# The engine sidecar (HANDOVER.md, #7) is staged by .github/actions/engine-sidecar from docmap.nvim's
# rolling release `standalone-latest`. Skipped on macOS on purpose, not by oversight: docmap.nvim
# publishes no macOS build of the engine. A macOS build of this app still succeeds without it.
#
# Actions are pinned by commit; a job gets only the rights it needs.

name: Release

on:
  push:
    tags:
      - "v*"

# One run per tag at a time: a tag that was deleted and set again waits for the run it replaces.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  check:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag, the versions and the CI of this commit agree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::the tag $tag is not vX.Y.Z"; exit 1 ;;
          esac
          version="${tag#v}"
          conf="$(jq -r .version src-tauri/tauri.conf.json)"
          crate="$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [ "$version" != "$conf" ] || [ "$version" != "$crate" ]; then
            echo "::error::the tag says $version, src-tauri/tauri.conf.json says $conf and src-tauri/Cargo.toml says $crate (bump both in a commit of their own first)"
            exit 1
          fi
          # A release comes from main, never from a side branch.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit of the tag is not on main"
            exit 1
          fi
          green="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')"
          if [ "$green" -lt 1 ]; then
            echo "::error::no green CI run for $GITHUB_SHA: wait for it, or fix main, then tag again"
            exit 1
          fi
          # A published release is never cut again: stop before anything is built.
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" && [ "$draft" != "true" ]; then
            echo "::error::the release $tag is published: it is never cut again, make a patch release"
            exit 1
          fi

  build:
    needs: check
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - uses: ./.github/actions/engine-sidecar
        with:
          triple: x86_64-pc-windows-msvc
          token: ${{ github.token }}

      # The Tauri CLI directly, not tauri-apps/tauri-action: on the self-hosted runner the action's CLI does
      # not find `cargo` ("cargo metadata ... os error 2"), while the same CLI started from the job's own
      # shell does. The action only built here anyway (no tagName, nothing uploaded).
      - name: Build the installers
        run: npx --yes @tauri-apps/cli@2.12.4 build

      # What Tauri made is for Tauri to decide (`bundle.targets` is "all"); what is published is the
      # installers, not the signatures and updater archives next to them: the NSIS setup and the MSI.
      - name: Collect the installers
        run: |
          mkdir -p dist
          for file in src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            if [ -e "dist/$name" ]; then
              echo "::error::two files are called $name"
              exit 1
            fi
            cp "$file" "dist/$name"
          done
          ls -l dist
          test -n "$(ls -A dist)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # The draft (made here when there is none), the installers, the install scripts stamped for this tag and
  # the checksums of all of them. Two files, which is the number to expect (the NSIS setup and the `.msi`
  # of Windows); a build that made fewer leaves the number short and nothing is published.
  publish:
    needs: [check, build]
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: WKDSteve/appkit/release-kit/publish@2d0f4a6921d11848bbb579e2760614e88723e42d # v0.23.1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          title: docmap-desktop ${{ github.ref_name }}
          files: dist
          expect: 2
          app: docmap-desktop
          windows-kind: nsis
          windows-release-asset: docmap-desktop_{version}_x64-setup.exe
          windows-rolling-asset: docmap-desktop-windows-x86_64-setup.exe
          notes-file: .github/release-notes.md
