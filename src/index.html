<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docmap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      No framework, on purpose. The thing this window mostly shows is a page
      it did not write: a self-contained 1.5 MB artifact that renders itself.
      Around it there is a list and two buttons. A framework here would be
      more machinery than subject.
    -->
    <aside id="sidebar">
      <header>
        <h1>docmap</h1>
        <p class="sub">module maps, by project</p>
      </header>

      <div class="actions">
        <button id="add" data-help="Pick a folder to add. It does not need a map yet — if it has none and an engine is configured, one is generated right away, because there is nothing to overwrite." type="button">Add project…</button>
        <button id="gen" data-help="Rebuild the selected project's map, overwriting what is there. Writes into that repository's docs/map." type="button" disabled>Generate map</button>
        <button id="gen-all" data-help="Rebuild every project in the list, one after another. The only button that writes to repositories you did not select — the label counts progress while it runs." type="button" disabled>Generate all</button>
        <button id="import-nvim" data-help="Read your Neovim config's plugin specs, clone every plugin that is not here yet, and add each one as Add project… would." type="button">Import from Neovim…</button>
        <button id="import-url" data-help="Clone a repository URL (shallow) into the app's own cache and add it. Uses whatever credentials a plain git clone would." type="button">Import from URL…</button>
      </div>

      <ul id="projects" aria-label="Projects"></ul>

      <p id="empty" class="empty" hidden>
        No projects yet. <strong>Add project…</strong> points this at a
        repository; it does not have to have a map already.
      </p>

      <!-- The engine is a separate program this one runs. Saying which one,
           and where it came from, is the difference between "generation is
           broken" and "nothing is configured yet".

           Collapsed, because locating it is a rare act: where `docmap` is on
           PATH there is nothing to do here, ever. What stays visible is the
           verdict — the summary always carries "ready" / "no grammars" /
           "not found", which is what decides whether generation works and at
           what fidelity. Hiding *that* to save a line would trade a rare
           convenience for the one thing worth seeing.

           `<details>` rather than a hand-rolled toggle: keyboard operation,
           the disclosure semantics and the open/closed state come with the
           element instead of being reimplemented on a div. -->
      <details id="engine">
        <summary>
          <span class="engine-label">Engine</span>
          <span id="engine-summary" class="engine-summary"></span>
        </summary>
        <p id="engine-state" class="engine-state"></p>
        <div class="engine-actions">
          <button id="pick-engine" data-help="Point at documentation.nvim's standalone binary. Only needed when it is not on PATH — the line above says which one was found." type="button">Locate…</button>
          <button id="pick-grammars" data-help="Point at a directory of compiled tree-sitter grammars. Decides fidelity, not success: without them you get a complete module tree and no per-function data." type="button">Grammars…</button>
        </div>
      </details>

      <!-- Same shape as #engine, for the same reason: spec-import runs a
           real `nvim` subprocess against a real config directory, and
           "import failed" is meaningless without saying which binary and
           which config it tried. Collapsed by default for the same reason
           too -- most machines resolve both automatically (PATH search,
           the platform-conventional config location) and never need this
           panel open. -->
      <details id="nvim">
        <summary>
          <span class="engine-label">Neovim</span>
          <span id="nvim-summary" class="engine-summary"></span>
        </summary>
        <p id="nvim-state" class="engine-state"></p>
        <div class="engine-actions">
          <button id="pick-nvim" data-help="Point at the nvim binary used for importing plugin specs. Only needed when it is not on PATH." type="button">Locate nvim…</button>
          <button id="pick-nvim-config" data-help="Point at the Neovim config directory to read plugin specs from, when it is not in the platform-conventional place." type="button">Locate config…</button>
        </div>
      </details>

      <footer id="status"></footer>
    </aside>

    <main id="view">
      <!-- The map is loaded in here. An iframe rather than a second window:
           switching projects should replace what is on screen, not spawn
           something to manage. -->
      <iframe id="map" title="Module map" hidden></iframe>

      <!-- The page posts which panel it is showing (postMessage — an
           iframe of a different origin has no other way out, and a button
           *inside* that panel could not reach this app's own process
           either way). Two panels ask for something this app's engine
           cannot do at all, ever, regardless of configuration:

             * Telemetry needs a live Neovim session actually running the
               code — nothing this app runs can make that data exist.
             * Hierarchy -> Types needs `lua-language-server`, wired
               through `vim.system`, which the standalone engine has no
               equivalent of.

           So this is a note, not a button: a control that looked like it
           would do the thing and then failed would be worse than no
           control, the same reasoning `no grammars`/`older engine without
           --api` already follow elsewhere in this app. Hidden by default,
           shown only for the two panels that need explaining, and cleared
           the moment the page reports anything else. -->
      <div id="context-note" class="context-note" hidden></div>

      <div id="placeholder" class="placeholder">
        <h2>Nothing selected</h2>
        <p>Pick a project on the left.</p>
      </div>
    </main>

    <!-- One help bubble, reused by every control that carries `data-help`.
         Same rules as the generated page's keyword card, deliberately: it
         waits for a deliberate hover rather than appearing as the pointer
         crosses a button, and it answers to Escape. A native `title` was the
         cheaper option and was turned down for one reason — it never appears
         on keyboard focus, so the controls a keyboard user reaches would be
         the only ones with no explanation. -->
    <div id="help" class="help" role="tooltip" hidden></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
